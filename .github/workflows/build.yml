name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p valcore

      - name: Build
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/valoliqht.exe dist/ValoLiqht-portable.exe
          Get-ChildItem target/release/bundle/nsis/*.exe | Copy-Item -Destination dist/ValoLiqht-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ValoLiqht
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
